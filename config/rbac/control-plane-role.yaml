---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: control-plane-role
rules:
  - apiGroups:
      - supabase.k8s.icb4dc0.de
    resources:
      - apigateways
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - supabase.k8s.icb4dc0.de
    resources:
      - apigateways/status
    verbs:
      - get
      - patch
      - update

  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
