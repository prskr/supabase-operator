[hooks]

# git hook pre commit
pre-commit = [
    "bazel run @rules_go//go -- mod tidy",
    "bazel build //...",
    "husky lint-staged",
]

# git hook commit msg
commit-msg = [
    "husky lint-commit",
]

# list staged files do some pre-process and git add
[lint-staged]
"*.go" = [
    # "goimports -l -w",
    # "gofumpt -l -w",
]
