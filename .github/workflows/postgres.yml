name: Postgres image
on:
  schedule:
    # every Thursday 2:30am
    - cron: '30 2 * * 2'
  push:
    paths:
      - .github/workflows/postgres.yml
      - postgres/**
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  packages: write
env:
  MINOR_VERSIONS: '{"15":"14","16":"10","17":"6","18":"0"}'
jobs:
  build:
    strategy:
      matrix:
        arch:
          - arm64
          - amd64
        postgres_major:
          - '15'
          - '16'
          - '17'
          # - '18' - not ready yet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Login to Harbor
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            postgres/Dockerfile
          layers: true
          image: ghcr.io/prskr/supabase-operator/postgres
          tags: ${{ matrix.postgres_major }}.${{ fromJSON(env.MINOR_VERSIONS)[matrix.postgres_major] }}.${{ github.run_number }}-${{ matrix.arch }}
          build-args: |
            POSTGRES_MAJOR=${{ matrix.postgres_major }}
            POSTGRES_MINOR=${{ fromJSON(env.MINOR_VERSIONS)[matrix.postgres_major] }}
      - name: Push to Harbor
        run: |
          podman push ${{ steps.build-image.outputs.image }}:${{ steps.build-image.outputs.tags }}
  manifest:
    strategy:
      matrix:
        postgres_major:
          - '15'
          - '16'
          - '17'
          - '18'
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Login to Harbor
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest
        run: |
          buildah manifest create \
              ghcr.io/prskr/supabase-operator/postgres:${{ matrix.postgres_major }}.${{ fromJSON(env.MINOR_VERSIONS)[matrix.postgres_major] }}.${{ github.run_number }} \
              ghcr.io/prskr/supabase-operator/postgres:${{ matrix.postgres_major }}.${{ fromJSON(env.MINOR_VERSIONS)[matrix.postgres_major] }}.${{ github.run_number }}-arm64 \
              ghcr.io/prskr/supabase-operator/postgres:${{ matrix.postgres_major }}.${{ fromJSON(env.MINOR_VERSIONS)[matrix.postgres_major] }}.${{ github.run_number }}-amd64

          buildah tag \
              ghcr.io/prskr/supabase-operator/postgres:${{ matrix.postgres_major }}.${{ fromJSON(env.MINOR_VERSIONS)[matrix.postgres_major] }}.${{ github.run_number }} \
              ghcr.io/prskr/supabase-operator/postgres:${{ matrix.postgres_major }}.${{ fromJSON(env.MINOR_VERSIONS)[matrix.postgres_major] }}

          buildah manifest push --all ghcr.io/prskr/supabase-operator/postgres:${{ matrix.postgres_major }}.${{ fromJSON(env.MINOR_VERSIONS)[matrix.postgres_major] }}
          buildah manifest push --all ghcr.io/prskr/supabase-operator/postgres:${{ matrix.postgres_major }}.${{ fromJSON(env.MINOR_VERSIONS)[matrix.postgres_major] }}.${{ github.run_number }}
