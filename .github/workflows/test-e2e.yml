name: E2E Tests
on:
  push:
  pull_request:
jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
      - name: Create kind cluster
        run: bazel run //dev:start_cluster`
      - name: Running Test e2e
        run: |
          bazel test //test/e2e/...
      - name: Cleanup kind cluster
        if: always()
        run: |
          bazel run //dev:teardown_cluster
