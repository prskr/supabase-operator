name: Docs
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build the website
        run: bazel run --run_in_cwd @multitool//tools/hugo:hugo -- build --source docs --destination ../_site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
  deploy:
    # for the time being, let's just always deploy the docs
    # if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
