name: Go
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow_ref }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'
          fetch-tags: 'true'
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app and images
        run: |
          bazel --bazelrc=.github/workflows/ci.bazelrc test //... || true
          bazel --bazelrc=.github/workflows/ci.bazelrc build //:image_multiarch
      - name: Release
        if: github.ref_type == 'tag'
        run: |
          echo "Pushing image..."
          bazel --bazelrc=.github/workflows/ci.bazelrc run //:push

          echo "Generating release notes..."
          mkdir release
          git-cliff --current --output release/release-notes.md

          sh -c "cd config/release/default && kustomize edit set image supabase-operator=ghcr.io/prskr/supabase-operator/controller:{{ github.ref_name }}"
          kustomize build config/release/default > release/operator_manifest.yaml

          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            release/operator_manifest.yaml
